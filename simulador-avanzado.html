<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Climático Andes Observatorio — Latinoamérica 2020-2100</title>
<style>
  :root {
    --kimi-color-text-primary: #1a1a1a;
    --kimi-color-text-secondary: #4a4a4a;
    --kimi-color-text-tertiary: #8a8a8a;
    --kimi-color-text-quaternary: #b0b0b0;
    --kimi-color-surface: #f5f5f5;
    --kimi-color-surface-muted: #eaeaea;
    --kimi-color-surface-raised: #ffffff;
    --kimi-color-surface-strong: #e0e0e0;
    --kimi-color-border: #d0d0d0;
    --kimi-color-danger: #dc2626;
    --kimi-color-positive: #16a34a;
    --kimi-color-warning: #ca8a04;
    --kimi-color-accent: #2563eb;
    --kimi-chart-1: #2563eb;
    --kimi-chart-2: #dc2626;
    --kimi-chart-3: #16a34a;
    --kimi-chart-4: #7c3aed;
    --kimi-chart-5: #737373;
    --kimi-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --t-micro: 60ms;
    --t-fast: 120ms;
    --t-normal: 200ms;
    --t-slow: 300ms;
    --ease-out: cubic-bezier(0, 0, 0.2, 1);
    --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
  }
  body { margin:0; background:var(--kimi-color-surface); font-family:var(--kimi-font-sans); color:var(--kimi-color-text-primary); }
  #app { width:100%; max-width:960px; margin:0 auto; padding:16px; box-sizing:border-box; }
  .panel { border:1px solid var(--kimi-color-border); border-radius:12px; padding:16px; margin-bottom:16px; background:var(--kimi-color-surface-raised); }
  .panel-title { font-size:17px; font-weight:500; margin-bottom:12px; }
  .controls { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .control-group { display:flex; flex-direction:column; gap:4px; }
  .control-group label { font-size:12px; color:var(--kimi-color-text-tertiary); }
  select, input[type="range"] { font:inherit; padding:8px 12px; border:1px solid var(--kimi-color-border); border-radius:10px; background:var(--kimi-color-surface); color:var(--kimi-color-text-primary); font-size:14px; min-width:160px; }
  .metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:16px; }
  .metric { border:1px solid var(--kimi-color-border); border-radius:10px; padding:12px; text-align:center; }
  .metric-value { font-size:24px; font-weight:500; }
  .metric-label { font-size:12px; color:var(--kimi-color-text-tertiary); margin-top:4px; }
  .chart-container { position:relative; height:280px; }
  .chart-svg { width:100%; height:100%; }
  .chart-line { fill:none; stroke-width:2; }
  .chart-area { fill-opacity:0.15; }
  .chart-grid { stroke:var(--kimi-color-border); stroke-width:0.5; stroke-dasharray:3,3; }
  .chart-label { font-size:11px; fill:var(--kimi-color-text-tertiary); }
  .sirgas-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .sirgas-station { border:1px solid var(--kimi-color-border); border-radius:10px; padding:12px; }
  .ztd-bar { height:6px; border-radius:3px; margin-top:8px; background:var(--kimi-color-surface-muted); overflow:hidden; }
  .ztd-fill { height:100%; border-radius:3px; }
  .hurricane-track { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--kimi-color-border); }
  .cat-badge { font-size:11px; padding:2px 8px; border-radius:6px; font-weight:500; }
  #latamMap { height:420px; border-radius:12px; border:1px solid var(--kimi-color-border); }
  .scenario-tabs { display:flex; gap:4px; margin-bottom:12px; }
  .scenario-tab { padding:6px 14px; border-radius:8px; font-size:13px; cursor:pointer; border:1px solid var(--kimi-color-border); background:transparent; }
  .scenario-tab.active { background:var(--kimi-color-text-primary); color:var(--kimi-color-surface); }
  .legend { display:flex; gap:16px; justify-content:center; margin-top:8px; font-size:12px; }
  .impact-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .impact-card { border:1px solid var(--kimi-color-border); border-radius:10px; padding:14px; }
  .impact-bar { height:4px; border-radius:2px; margin-top:8px; background:var(--kimi-color-surface-muted); overflow:hidden; }
  .impact-fill { height:100%; border-radius:2px; }
  .sector-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--kimi-color-border); }
</style>

  function getProjection(country, variable, year, scenario) {
    const s = scenarios[scenario];
    const t = (year - 2020) / 80;
    const sigmoid = t * t * (3 - 2 * t);
    const noise = Math.sin(year * 0.5 + country.lon) * 0.03;
    switch(variable) {
      case 'temp': return country.baseTemp + s.tempFactor * sigmoid + noise;
      case 'precip': return country.basePrecip * (1 + s.precipFactor * sigmoid);
      case 'humidity': return Math.min(98, country.baseHum + s.humidityFactor * sigmoid);
      case 'wind': return Math.max(0, country.baseWind + s.windFactor * sigmoid);
      case 'ztd': return country.baseZTD + s.ztdFactor * sigmoid;
      case 'impacto': return getEconomicImpact(country, year, scenario);
      default: return 0;
    }

  function getEconomicImpact(country, year, scenario) {
    const s = scenarios[scenario];
    const t = (year - 2020) / 80;
    const sigmoid = t * t * (3 - 2 * t);

    const healthCost = country.pop * tempRise * 0.15 * s.costFactor;
    return Math.max(0, agriLoss + infraLoss + healthCost);
  }

  function getEconomicImpact(country, year, scenario) {
    const s = scenarios[scenario];
    const t = (year - 2020) / 80;
    const sigmoid = t * t * (3 - 2 * t);
    const tempRise = s.tempFactor * sigmoid;
    const hurricaneRisk = country.lat > 10 && country.lat < 30 ? 1.5 : (country.lat > -5 && country.lat < 15 ? 0.8 : 0.3);
    const coastalRisk = country.coastLength > 0 ? country.coastLength / 5000 : 0;
    const agriLoss = country.gdp * (country.agriPct / 100) * tempRise * 0.08;
    const infraLoss = country.gdp * country.infraVuln * tempRise * 0.03;
    const healthCost = country.pop * tempRise * 0.15 * s.costFactor;
    const disasterCost = country.gdp * hurricaneRisk * tempRise * 0.02 * s.costFactor;
    return Math.max(0, agriLoss + infraLoss + healthCost + disasterCost);
  }

  function getSectorBreakdown(country, year, scenario) {
    const s = scenarios[scenario];
    const t = (year - 2020) / 80;
    const sigmoid = t * t * (3 - 2 * t);
    const tempRise = s.tempFactor * sigmoid;
    const hurricaneRisk = country.lat > 10 && country.lat < 30 ? 1.5 : (country.lat > -5 && country.lat < 15 ? 0.8 : 0.3);
    const coastalRisk = country.coastLength > 0 ? country.coastLength / 5000 : 0;
    return [
      {name:'Agricultura y ganadería', cost: country.gdp * (country.agriPct / 100) * tempRise * 0.08},
      {name:'Infraestructura', cost: country.gdp * country.infraVuln * tempRise * 0.03},
      {name:'Salud pública', cost: country.pop * tempRise * 0.15 * s.costFactor},
      {name:'Desastres naturales', cost: country.gdp * hurricaneRisk * tempRise * 0.02 * s.costFactor},
      {name:'Turismo costero', cost: country.gdp * coastalRisk * tempRise * 0.015 * s.costFactor},
      {name:'Energía y agua', cost: country.gdp * tempRise * 0.012}
    ];
  }

      {title:'Per cápita', value:'$' + perCapita, sub:'USD/hab/año', color:'#7c3aed', pct: Math.min(100, perCapita / 50)},
      {title:'Acumulado', value:formatUSD(totalAccum), sub:'2020-' + currentYear, color:'#dc2626', pct: Math.min(100, totalAccum / 500)},
      {title:'Proyección 2100', value:formatUSD(impact2100), sub:'Costo anual', color:'#2563eb', pct: Math.min(100, impact2100 / currentCountry.gdp * 100 * 3)}
    ];
    cards.forEach(c => {
      const div = document.createElement('div');
      div.className = 'impact-card';
      div.innerHTML = `
        <div style="font-size:13px;font-weight:500;">${c.title}</div>
        <div style="font-size:22px;color:${c.color}">${c.value}</div>
        <div style="font-size:11px;color:#888;">${c.sub}</div>
      `;
      impactGrid.appendChild(div);
    });

    const sectors = getSectorBreakdown(currentCountry, currentYear, currentScenario);
    sectorList.innerHTML = '';
    sectors.forEach(sec => {
      const div = document.createElement('div');
      div.className = 'sector-row';
      div.innerHTML = `
        <span>${sec.name}</span>
        <span style="color:#dc2626;font-weight:500;">${formatUSD(sec.cost)}</span>
      `;
      sectorList.appendChild(div);
    });
  }

  function updateMetrics() {
    const val2020 = getProjection(currentCountry, currentVar, 2020, currentScenario);
    const val2100 = getProjection(currentCountry, currentVar, 2100, currentScenario);
    const valCurrent = getProjection(currentCountry, currentVar, currentYear, currentScenario);
    const delta = valCurrent - val2020;
    let unit = ''; let fmt = v => v.toFixed(1);
    if(currentVar === 'temp') unit = '°C';
    if(currentVar === 'precip') { unit = 'mm'; fmt = v => Math.round(v); }
    if(currentVar === 'humidity') unit = '%';
    if(currentVar === 'wind') unit = ' m/s';
    if(currentVar === 'ztd') { unit = ' m'; fmt = v => v.toFixed(3); }
    if(currentVar === 'impacto') fmt = v => formatUSD(v);
    metricsPanel.innerHTML = `
      <div class="metric"><div class="metric-value">${fmt(valCurrent)}${unit}</div><div class="metric-label">${currentYear}</div></div>
      <div class="metric"><div class="metric-value">${fmt(val2020)}${unit}</div><div class="metric-label">Base 2020</div></div>
      <div class="metric"><div class="metric-value">${fmt(val2100)}${unit}</div><div class="metric-label">2100</div></div>
      <div class="metric"><div class="metric-value">${currentScenario.toUpperCase()}</div><div class="metric-label">Escenario</div></div>
    `;
  }

  function drawChart() {
    const svg = mainChart;
    svg.innerHTML = '';
    const W = 900, H = 280, pad = {t:30,r:40,b:50,l:70};
    const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    const years = [];
    for(let y=2020; y<=2100; y+=2) years.push(y);
    const data = years.map(y => ({year:y, val:getProjection(currentCountry, currentVar, y, currentScenario)}));
    const minV = Math.min(...data.map(d=>d.val)) * 0.98;
    const maxV = Math.max(...data.map(d=>d.val)) * 1.02;
    const range = maxV - minV || 1;

    // Cuadrícula horizontal (5 líneas)
    for(let i=0; i<=5; i++) {
      const y = pad.t + ch * i / 5;
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', pad.l); line.setAttribute('y1', y); line.setAttribute('x2', W-pad.r); line.setAttribute('y2', y);
      line.setAttribute('class','chart-grid');
      svg.appendChild(line);
      const text = document.createElementNS('http://www.w3.org/2000/svg','text');
      text.setAttribute('x', pad.l-8); text.setAttribute('y', y+4); text.setAttribute('text-anchor','end');
      text.setAttribute('class','chart-label');
      if(currentVar === 'impacto') { text.textContent = formatUSD(maxV - range * i / 5); }
      else { text.textContent = (maxV - range * i / 5).toFixed(currentVar==='ztd'?3:1); }
      svg.appendChild(text);
    }

    // Cuadrícula vertical (cada 20 años)
    for(let i=0; i<=4; i++) {
      const x = pad.l + cw * i / 4;
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', x); line.setAttribute('y1', pad.t); line.setAttribute('x2', x); line.setAttribute('y2', H-pad.b);
      line.setAttribute('class','chart-grid');
      svg.appendChild(line);
      const text = document.createElementNS('http://www.w3.org/2000/svg','text');
      text.setAttribute('x', x); text.setAttribute('y', H-25); text.setAttribute('text-anchor','middle');
      text.setAttribute('class','chart-label');
      text.textContent = 2020 + i * 20;
      svg.appendChild(text);
    }

    let lineD = '';
    data.forEach((d,i) => {
      const x = pad.l + (d.year - 2020) / 80 * cw;
      const y = pad.t + ch - (d.val - minV) / range * ch;
      lineD += (i===0?'M':'L') + `${x},${y}`;
    });
    const line = document.createElementNS('http://www.w3.org/2000/svg','path');
    line.setAttribute('d', lineD);
    line.setAttribute('stroke', 'var(--kimi-chart-1)');
    line.setAttribute('class', 'chart-line');
    svg.appendChild(line);

    // Puntos con tooltip
    data.forEach((d,i) => {
      const x = pad.l + (d.year - 2020) / 80 * cw;
      const y = pad.t + ch - (d.val - minV) / range * ch;
      const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
      circle.setAttribute('cx', x); circle.setAttribute('cy', y); circle.setAttribute('r', 3);
      circle.setAttribute('fill', 'var(--kimi-chart-1)');
      circle.setAttribute('stroke', 'white'); circle.setAttribute('stroke-width', '1');
      const title = document.createElementNS('http://www.w3.org/2000/svg','title');
      if(currentVar === 'impacto') { title.textContent = `${d.year}: ${formatUSD(d.val)}`; }
      else { title.textContent = `${d.year}: ${d.val.toFixed(1)}`; }
      circle.appendChild(title);
      svg.appendChild(circle);
    });
    // Etiquetas de ejes
    const varNames = {temp:'Temperatura (°C)', precip:'Precipitación (mm)', humidity:'Humedad (%)', wind:'Viento (m/s)', ztd:'ZTD (m)', impacto:'Impacto (USD)'};
    const xLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
    xLabel.setAttribute('x', 450); xLabel.setAttribute('y', 265); xLabel.setAttribute('text-anchor','middle');
    xLabel.setAttribute('class','chart-label');
    xLabel.textContent = 'Año (2020 - 2100)';
    svg.appendChild(xLabel);
    
    const yLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
    yLabel.setAttribute('x', 15); yLabel.setAttribute('y', 140); yLabel.setAttribute('text-anchor','middle');
    yLabel.setAttribute('transform', 'rotate(-90,20,140)');
    yLabel.setAttribute('x', 8);
    yLabel.setAttribute('class','chart-label');
    yLabel.textContent = varNames[currentVar] || '';
    svg.appendChild(yLabel);

    chartLegend.innerHTML = `<div class="legend-item"><div class="legend-dot" style="background:var(--kimi-chart-1)"></div>${currentScenario.toUpperCase()}</div>`;
  }

  function updateMap() {
    if(!map) return;
    map.setView([currentCountry.lat, currentCountry.lon], 5);
    if(marcadorActual) marcadorActual.setLatLng([currentCountry.lat, currentCountry.lon]);
    Object.values(window.paisesGeoJSON).forEach(layer => {
      layer.setStyle({ color: '#2563eb', weight: 1, fillColor: '#2563eb', fillOpacity: 0.08 });
    });
    const layerActual = window.paisesGeoJSON[currentCountry.name];
    if(layerActual) {
      layerActual.setStyle({ color: '#dc2626', weight: 3, fillColor: '#dc2626', fillOpacity: 0.25 });
    }
  }

  function updateAll() {
    currentCountry = countries.find(c => c.name === countrySelect.value) || countries[0];
    currentVar = varSelect.value;
    currentYear = parseInt(yearSlider.value);
    yearLabel.textContent = currentYear;
    updateMetrics();
    drawChart();
    updateMap();
    sirgasPanel.style.display = currentVar === 'ztd' ? 'block' : 'none';
    hurricanePanel.style.display = currentVar === 'hurricanes' ? 'block' : 'none';
    impactoPanel.style.display = currentVar === 'impacto' ? 'block' : 'none';
  }

  countrySelect.addEventListener('change', updateAll);
  varSelect.addEventListener('change', updateAll);
  yearSlider.addEventListener('input', updateAll);
  document.querySelectorAll('.scenario-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.scenario-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentScenario = tab.dataset.scenario;
      updateAll();
    });
  });

  map = L.map('latamMap').setView([-15, -60], 3);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '© OpenStreetMap'}).addTo(map);

  const paisesArchivos = {
    "México": "mexico", "Guatemala": "guatemala", "Belice": "belice",
    "Honduras": "honduras", "El Salvador": "el_salvador", "Nicaragua": "nicaragua",
    "Costa Rica": "costa_rica", "Panamá": "panama", "Colombia": "colombia",
    "Venezuela": "venezuela", "Ecuador": "ecuador", "Perú": "peru",
    "Bolivia": "bolivia", "Brasil": "brasil", "Paraguay": "paraguay",
    "Uruguay": "uruguay", "Argentina": "argentina", "Chile": "chile",
    "Cuba": "cuba", "República Dominicana": "republica_dominicana",
    "Haití": "haiti", "Jamaica": "jamaica"
  };

  window.paisesGeoJSON = {};
  Object.entries(paisesArchivos).forEach(([nombre, archivo]) => {
    fetch(`assets/geojson/paises/${archivo}.json`)
      .then(r => r.json())
      .then(geojson => {
        const layer = L.geoJSON(geojson, {
          style: { color: '#2563eb', weight: 0.5, fillColor: '#2563eb', fillOpacity: 0.03 }
        }).bindPopup(nombre).addTo(map);
        layer.on('click', () => {
          countrySelect.value = nombre;
          updateAll();
          Object.values(window.paisesGeoJSON).forEach(l => {
            l.setStyle({ color: '#2563eb', weight: 0.5, fillColor: '#2563eb', fillOpacity: 0.03 });
          });
          layer.setStyle({ color: '#dc2626', weight: 3, fillColor: '#dc2626', fillOpacity: 0.25 });
        });
        layer.on('mouseover', () => {
          layer.setStyle({ color: '#f59e0b', weight: 2, fillColor: '#f59e0b', fillOpacity: 0.15 });
        });
        layer.on('mouseout', () => {
          if (currentCountry.name !== nombre) {
            layer.setStyle({ color: '#2563eb', weight: 0.5, fillColor: '#2563eb', fillOpacity: 0.03 });
          }
        });
        window.paisesGeoJSON[nombre] = layer;
      })
      .catch(e => console.warn(`No se pudo cargar ${nombre}`, e));
  });

  marcadorActual = L.circleMarker([countries[0].lat, countries[0].lon], {radius:10, fillColor:'#dc2626', color:'#991b1b', weight:2, fillOpacity:0.9}).addTo(map);
  updateAll();
})();
</script>
</body>
</html>
