<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Climático Andes Observatorio — Latinoamérica 2020-2100</title>
<style>
  :root {
    --kimi-color-text-primary: #1a1a1a;
    --kimi-color-text-secondary: #4a4a4a;
    --kimi-color-text-tertiary: #8a8a8a;
    --kimi-color-text-quaternary: #b0b0b0;
    --kimi-color-surface: #f5f5f5;
    --kimi-color-surface-muted: #eaeaea;
    --kimi-color-surface-raised: #ffffff;
    --kimi-color-surface-strong: #e0e0e0;
    --kimi-color-border: #d0d0d0;
    --kimi-color-danger: #dc2626;
    --kimi-color-positive: #16a34a;
    --kimi-color-warning: #ca8a04;
    --kimi-color-accent: #2563eb;
    --kimi-chart-1: #2563eb;
    --kimi-chart-2: #dc2626;
    --kimi-chart-3: #16a34a;
    --kimi-chart-4: #7c3aed;
    --kimi-chart-5: #737373;
    --kimi-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --kimi-font-mono: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace;
    --t-micro: 60ms;
    --t-fast: 120ms;
    --t-normal: 200ms;
    --t-slow: 300ms;
    --ease-out: cubic-bezier(0, 0, 0.2, 1);
    --ease-in: cubic-bezier(0.4, 0, 1, 1);
    --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --kimi-color-text-primary: #f0f0f0;
      --kimi-color-text-secondary: #c0c0c0;
      --kimi-color-text-tertiary: #888888;
      --kimi-color-text-quaternary: #555555;
      --kimi-color-surface: #1a1a1a;
      --kimi-color-surface-muted: #252525;
      --kimi-color-surface-raised: #2a2a2a;
      --kimi-color-surface-strong: #333333;
      --kimi-color-border: #3a3a3a;
    }
  }
  body { margin:0; background:var(--kimi-color-surface); font-family:var(--kimi-font-sans); color:var(--kimi-color-text-primary); }
  #app { width:100%; max-width:960px; margin:0 auto; padding:16px; box-sizing:border-box; }
  .panel { border:1px solid var(--kimi-color-border); border-radius:12px; padding:16px; margin-bottom:16px; background:var(--kimi-color-surface-raised); }
  .panel-title { font-size:17px; font-weight:500; margin-bottom:12px; color:var(--kimi-color-text-primary); }
  .controls { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .control-group { display:flex; flex-direction:column; gap:4px; }
  .control-group label { font-size:12px; color:var(--kimi-color-text-tertiary); }
  select, input[type="range"] { font:inherit; padding:8px 12px; border:1px solid var(--kimi-color-border); border-radius:10px; background:var(--kimi-color-surface); color:var(--kimi-color-text-primary); font-size:14px; min-width:160px; }
  input[type="range"] { padding:0; min-width:200px; accent-color:var(--kimi-color-text-primary); }
  .metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:16px; }
  .metric { border:1px solid var(--kimi-color-border); border-radius:10px; padding:12px; text-align:center; background:var(--kimi-color-surface-raised); }
  .metric-value { font-size:28px; font-weight:500; line-height:1.1; font-variant-numeric:tabular-nums; }
  .metric-label { font-size:12px; color:var(--kimi-color-text-tertiary); margin-top:4px; }
  .metric-delta { font-size:12px; margin-top:2px; }
  .positive { color:var(--kimi-color-positive); }
  .negative { color:var(--kimi-color-danger); }
  .warning { color:var(--kimi-color-warning); }
  .chart-container { position:relative; height:280px; }
  .chart-svg { width:100%; height:100%; }
  .chart-line { fill:none; stroke-width:2; stroke-linecap:round; }
  .chart-area { fill-opacity:0.15; }
  .chart-grid { stroke:var(--kimi-color-border); stroke-width:0.5; stroke-dasharray:3,3; }
  .chart-axis { stroke:var(--kimi-color-text-quaternary); stroke-width:0.5; }
  .chart-label { font-size:11px; fill:var(--kimi-color-text-tertiary); }
  .chart-title { font-size:14px; fill:var(--kimi-color-text-secondary); font-weight:500; }
  .sirgas-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .sirgas-station { border:1px solid var(--kimi-color-border); border-radius:10px; padding:12px; background:var(--kimi-color-surface-raised); }
  .station-name { font-size:14px; font-weight:500; margin-bottom:4px; }
  .station-meta { font-size:12px; color:var(--kimi-color-text-tertiary); }
  .ztd-bar { height:6px; border-radius:3px; margin-top:8px; background:var(--kimi-color-surface-muted); overflow:hidden; }
  .ztd-fill { height:100%; border-radius:3px; transition:width 0.3s var(--ease-out); }
  .hurricane-track { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--kimi-color-border); }
  .hurricane-track:last-child { border-bottom:none; }
  .cat-badge { font-size:11px; padding:2px 8px; border-radius:6px; font-weight:500; }
  .cat-1 { background:rgba(37,99,235,0.15); color:var(--kimi-chart-1); }
  .cat-3 { background:rgba(220,38,38,0.15); color:var(--kimi-chart-2); }
  .cat-5 { background:rgba(220,38,38,0.25); color:var(--kimi-color-danger); }
  .map-container { display:flex; justify-content:center; margin:16px 0; }
  .latam-map { width:100%; max-width:500px; }
  .map-country { fill:var(--kimi-color-surface-muted); stroke:var(--kimi-color-border); stroke-width:0.5; transition:fill 0.2s; cursor:pointer; }
  .map-country:hover { fill:rgba(37,99,235,0.2); }
  .map-country.active { fill:rgba(37,99,235,0.35); }
  .scenario-tabs { display:flex; gap:4px; margin-bottom:12px; }
  .scenario-tab { padding:6px 14px; border-radius:8px; font-size:13px; cursor:pointer; border:1px solid var(--kimi-color-border); background:transparent; color:var(--kimi-color-text-secondary); }
  .scenario-tab.active { background:var(--kimi-color-text-primary); color:var(--kimi-color-surface); border-color:var(--kimi-color-text-primary); }
  .legend { display:flex; gap:16px; justify-content:center; margin-top:8px; font-size:12px; }
  .legend-item { display:flex; align-items:center; gap:4px; }
  .legend-dot { width:8px; height:8px; border-radius:50%; }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<base target="_blank">
</head>
<body>
<div id="app">
<div class="panel">
  <div class="panel-title">Simulador climático Andes Observatorio — Latinoamérica 2020-2100</div>
  <div class="scenario-tabs" id="scenarioTabs">
    <div class="scenario-tab active" data-scenario="ssp245">SSP2-4.5 (moderado)</div>
    <div class="scenario-tab" data-scenario="ssp585">SSP5-8.5 (alto)</div>
    <div class="scenario-tab" data-scenario="ssp126">SSP1-2.6 (bajo)</div>
  </div>
  <div class="controls">
    <div class="control-group">
      <label>País / Región</label>
      <select id="countrySelect"></select>
    </div>
    <div class="control-group">
      <label>Variable climática</label>
      <select id="varSelect">
        <option value="temp">Temperatura media (°C)</option>
        <option value="precip">Precipitación anual (mm)</option>
        <option value="humidity">Humedad relativa (%)</option>
        <option value="wind">Velocidad del viento (m/s)</option>
        <option value="hurricanes">Huracanes / Ciclones tropicales</option>
        <option value="ztd">Retardo troposférico cenital ZTD (m)</option>
      </select>
    </div>
    <div class="control-group">
      <label>Año de referencia: <span id="yearLabel">2020</span></label>
      <input type="range" id="yearSlider" min="2020" max="2100" value="2020" step="1">
    </div>
  </div>
</div>

<div class="metrics" id="metricsPanel"></div>

<div class="panel">
  <div class="panel-title">Proyección temporal 2020 — 2100</div>
  <div class="chart-container">
    <svg class="chart-svg" id="mainChart" viewBox="0 0 900 280" preserveAspectRatio="none"></svg>
  </div>
  <div class="legend" id="chartLegend"></div>
</div>

<div class="panel">
  <div class="panel-title">Mapa de referencia — América Latina</div>
  <div id="latamMap" style="height:400px;border-radius:12px;"></div>
</div>

<div class="panel" id="sirgasPanel" style="display:none;">
  <div class="panel-title">Red SIRGAS-CON — Retardo troposférico cenital (ZTD)</div>
  <div class="sirgas-grid" id="sirgasGrid"></div>
</div>

<div class="panel" id="hurricanePanel" style="display:none;">
  <div class="panel-title">Huracanes y ciclones tropicales proyectados</div>
  <div id="hurricaneList"></div>
</div>
</div>

<script>
(function(){
  const countries = [
    {name:"México", code:"MEX", lat:23.6, lon:-102.5, baseTemp:21.0, basePrecip:750, baseHum:55, baseWind:3.2, baseZTD:2.35},
    {name:"Guatemala", code:"GTM", lat:15.7, lon:-90.2, baseTemp:23.5, basePrecip:2000, baseHum:72, baseWind:2.1, baseZTD:2.55},
    {name:"Belice", code:"BLZ", lat:17.2, lon:-88.5, baseTemp:25.8, basePrecip:1800, baseHum:78, baseWind:2.8, baseZTD:2.60},
    {name:"Honduras", code:"HND", lat:14.8, lon:-86.8, baseTemp:24.2, basePrecip:1500, baseHum:70, baseWind:2.5, baseZTD:2.52},
    {name:"El Salvador", code:"SLV", lat:13.7, lon:-88.9, baseTemp:24.5, basePrecip:1700, baseHum:68, baseWind:2.3, baseZTD:2.50},
    {name:"Nicaragua", code:"NIC", lat:12.9, lon:-85.2, baseTemp:25.0, basePrecip:1900, baseHum:75, baseWind:2.6, baseZTD:2.58},
    {name:"Costa Rica", code:"CRI", lat:9.7, lon:-83.9, baseTemp:24.0, basePrecip:2800, baseHum:82, baseWind:2.4, baseZTD:2.65},
    {name:"Panamá", code:"PAN", lat:8.5, lon:-80.0, baseTemp:26.0, basePrecip:2600, baseHum:80, baseWind:2.2, baseZTD:2.68},
    {name:"Colombia", code:"COL", lat:4.0, lon:-73.2, baseTemp:24.5, basePrecip:2400, baseHum:78, baseWind:2.0, baseZTD:2.62},
    {name:"Venezuela", code:"VEN", lat:6.4, lon:-66.6, baseTemp:26.5, basePrecip:1500, baseHum:72, baseWind:2.7, baseZTD:2.55},
    {name:"Ecuador", code:"ECU", lat:-1.8, lon:-78.2, baseTemp:20.0, basePrecip:2000, baseHum:75, baseWind:2.1, baseZTD:2.45},
    {name:"Perú", code:"PER", lat:-9.2, lon:-75.0, baseTemp:19.5, basePrecip:1500, baseHum:65, baseWind:2.8, baseZTD:2.30},
    {name:"Bolivia", code:"BOL", lat:-16.3, lon:-63.6, baseTemp:21.0, basePrecip:1100, baseHum:60, baseWind:2.5, baseZTD:2.25},
    {name:"Brasil", code:"BRA", lat:-14.2, lon:-51.9, baseTemp:25.0, basePrecip:1700, baseHum:70, baseWind:2.3, baseZTD:2.50},
    {name:"Paraguay", code:"PRY", lat:-23.4, lon:-58.4, baseTemp:23.0, basePrecip:1300, baseHum:65, baseWind:2.6, baseZTD:2.35},
    {name:"Uruguay", code:"URY", lat:-32.5, lon:-55.8, baseTemp:17.5, basePrecip:1200, baseHum:72, baseWind:3.5, baseZTD:2.20},
    {name:"Argentina", code:"ARG", lat:-38.4, lon:-63.6, baseTemp:15.0, basePrecip:600, baseHum:55, baseWind:3.8, baseZTD:2.15},
    {name:"Chile", code:"CHL", lat:-35.7, lon:-71.5, baseTemp:12.0, basePrecip:800, baseHum:60, baseWind:4.2, baseZTD:2.10},
    {name:"Cuba", code:"CUB", lat:21.5, lon:-79.0, baseTemp:25.5, basePrecip:1300, baseHum:76, baseWind:3.0, baseZTD:2.52},
    {name:"República Dominicana", code:"DOM", lat:18.7, lon:-70.2, baseTemp:26.0, basePrecip:1400, baseHum:78, baseWind:2.9, baseZTD:2.55},
    {name:"Haití", code:"HTI", lat:18.9, lon:-72.3, baseTemp:25.5, basePrecip:1400, baseHum:75, baseWind:2.8, baseZTD:2.53},
    {name:"Jamaica", code:"JAM", lat:18.1, lon:-77.3, baseTemp:27.0, basePrecip:2000, baseHum:74, baseWind:3.2, baseZTD:2.58}
  ];

  const scenarios = {
    ssp245: { tempFactor: 2.5, precipFactor: 0.15, humidityFactor: 6, windFactor: 0.4, ztdFactor: 0.25 },
    ssp585: { tempFactor: 4.2, precipFactor: 0.30, humidityFactor: 10, windFactor: 0.8, ztdFactor: 0.42 },
    ssp126: { tempFactor: 1.2, precipFactor: 0.05, humidityFactor: 3, windFactor: 0.15, ztdFactor: 0.12 }
  };

  const sirgasStations = [
    {name:"BOGT", city:"Bogotá, COL", lat:4.6, baseZTD:2.42},
    {name:"LPGS", city:"La Paz, BOL", lat:-16.5, baseZTD:2.18},
    {name:"SANT", city:"Santiago, CHL", lat:-33.4, baseZTD:2.08},
    {name:"RIOG", city:"Rio Grande, ARG", lat:-53.8, baseZTD:2.02},
    {name:"BRFT", city:"Brasilia, BRA", lat:-15.9, baseZTD:2.48},
    {name:"MANA", city:"Manaus, BRA", lat:-3.1, baseZTD:2.62},
    {name:"QUIT", city:"Quito, ECU", lat:-0.2, baseZTD:2.38},
    {name:"LIM2", city:"Lima, PER", lat:-12.0, baseZTD:2.28},
    {name:"CARI", city:"Caracas, VEN", lat:10.5, baseZTD:2.52},
    {name:"MEXI", city:"México D.F., MEX", lat:19.4, baseZTD:2.32},
    {name:"HAVA", city:"La Habana, CUB", lat:23.1, baseZTD:2.50},
    {name:"SJO1", city:"San José, CRI", lat:9.9, baseZTD:2.64}
  ];

  let currentCountry = countries[0];
  let currentScenario = 'ssp245';
  let currentVar = 'temp';
  let currentYear = 2020;

  const countrySelect = document.getElementById('countrySelect');
  countries.forEach(c => { const o = document.createElement('option'); o.value = c.name; o.textContent = c.name; countrySelect.appendChild(o); });

  const varSelect = document.getElementById('varSelect');
  const yearSlider = document.getElementById('yearSlider');
  const yearLabel = document.getElementById('yearLabel');
  const scenarioTabs = document.querySelectorAll('.scenario-tab');
  const metricsPanel = document.getElementById('metricsPanel');
  const mainChart = document.getElementById('mainChart');
  const chartLegend = document.getElementById('chartLegend');
  const sirgasPanel = document.getElementById('sirgasPanel');
  const sirgasGrid = document.getElementById('sirgasGrid');
  const hurricanePanel = document.getElementById('hurricanePanel');
  const hurricaneList = document.getElementById('hurricaneList');

  function getProjection(country, variable, year, scenario) {
    const s = scenarios[scenario];
    const t = (year - 2020) / 80;
    const sigmoid = t * t * (3 - 2 * t);
    const noise = Math.sin(year * 0.5 + country.lon) * 0.03;
    switch(variable) {
      case 'temp': return country.baseTemp + s.tempFactor * sigmoid * (1 + 0.3 * Math.sin(year * 0.3)) + noise * 2;
      case 'precip': return country.basePrecip * (1 + s.precipFactor * sigmoid * Math.sin(year * 0.2 + country.lat) + noise);
      case 'humidity': return Math.min(98, country.baseHum + s.humidityFactor * sigmoid + noise * 5);
      case 'wind': return Math.max(0, country.baseWind + s.windFactor * sigmoid * (0.5 + 0.5 * Math.cos(year * 0.15)) + noise);
      case 'ztd': return country.baseZTD + s.ztdFactor * sigmoid * (1 + 0.2 * Math.sin(year * 0.4 + country.lat)) + noise;
      default: return 0;
    }
  }

  function getHurricaneData(country, year, scenario) {
    const s = scenarios[scenario];
    const intensity = Math.min(1, (year - 2020) / 80 * (s.tempFactor / 4.2));
    const baseCount = country.lat > 10 && country.lat < 30 ? 3 + intensity * 4 : country.lat > -30 && country.lat < 10 ? 1 + intensity * 2 : 0;
    const count = Math.round(baseCount + Math.sin(year * 0.7) * 0.5);
    const tracks = [];
    const names = ['Ana','Bill','Claudette','Danny','Elsa','Fred','Grace','Henri','Ida','Julian','Kate','Larry','Mindy','Nicholas','Odette','Peter','Rose','Sam','Teresa','Victor','Wanda'];
    for(let i=0; i<count; i++) {
      const cat = Math.min(5, Math.max(1, Math.round(1 + intensity * 3 + Math.random() * 1.5)));
      tracks.push({name: names[i % names.length] + '-' + year, category: cat, month: 6 + Math.floor(Math.random()*5), wind: 64 + cat * 30 + Math.random()*20});
    }
    return tracks;
  }

  function updateMetrics() {
    const val2020 = getProjection(currentCountry, currentVar, 2020, currentScenario);
    const val2100 = getProjection(currentCountry, currentVar, 2100, currentScenario);
    const valCurrent = getProjection(currentCountry, currentVar, currentYear, currentScenario);
    const delta = valCurrent - val2020;
    const pct = val2020 !== 0 ? (delta / val2020 * 100).toFixed(1) : '0';

    let unit = ''; let fmt = v => v.toFixed(1);
    if(currentVar === 'temp') { unit = '°C'; }
    if(currentVar === 'precip') { unit = 'mm'; fmt = v => Math.round(v).toString(); }
    if(currentVar === 'humidity') { unit = '%'; }
    if(currentVar === 'wind') { unit = 'm/s'; }
    if(currentVar === 'ztd') { unit = 'm'; fmt = v => v.toFixed(3); }

    const deltaClass = delta > 0 ? 'positive' : (delta < 0 ? 'negative' : '');
    const deltaSign = delta > 0 ? '+' : '';

    let mHTML = '';
    mHTML += `<div class="metric"><div class="metric-value">${fmt(valCurrent)}${unit}</div><div class="metric-label">Valor ${currentYear}</div><div class="metric-delta ${deltaClass}">${deltaSign}${fmt(delta)}${unit} vs 2020</div></div>`;
    mHTML += `<div class="metric"><div class="metric-value">${fmt(val2020)}${unit}</div><div class="metric-label">Línea base 2020</div></div>`;
    mHTML += `<div class="metric"><div class="metric-value">${fmt(val2100)}${unit}</div><div class="metric-label">Proyección 2100</div><div class="metric-delta ${deltaClass}">${deltaSign}${pct}%</div></div>`;
    mHTML += `<div class="metric"><div class="metric-value">${currentScenario.toUpperCase()}</div><div class="metric-label">Escenario SSP</div></div>`;
    metricsPanel.innerHTML = mHTML;
  }

  function drawChart() {
    const svg = mainChart;
    svg.innerHTML = '';
    const W = 900, H = 280, pad = {t:30,r:40,b:40,l:60};
    const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;

    const years = [];
    for(let y=2020; y<=2100; y+=2) years.push(y);
    const data = years.map(y => ({year:y, val:getProjection(currentCountry, currentVar, y, currentScenario)}));
    const minV = Math.min(...data.map(d=>d.val)) * 0.98;
    const maxV = Math.max(...data.map(d=>d.val)) * 1.02;
    const range = maxV - minV || 1;

    for(let i=0; i<=5; i++) {
      const y = pad.t + ch * i / 5;
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', pad.l); line.setAttribute('y1', y); line.setAttribute('x2', W-pad.r); line.setAttribute('y2', y);
      line.setAttribute('class','chart-grid'); svg.appendChild(line);
      const text = document.createElementNS('http://www.w3.org/2000/svg','text');
      text.setAttribute('x', pad.l-8); text.setAttribute('y', y+4); text.setAttribute('text-anchor','end');
      text.setAttribute('class','chart-label');
      text.textContent = (maxV - range * i / 5).toFixed(currentVar==='ztd'?3:1);
      svg.appendChild(text);
    }
    for(let i=0; i<=4; i++) {
      const x = pad.l + cw * i / 4;
      const text = document.createElementNS('http://www.w3.org/2000/svg','text');
      text.setAttribute('x', x); text.setAttribute('y', H-10); text.setAttribute('text-anchor','middle');
      text.setAttribute('class','chart-label');
      text.textContent = 2020 + i * 20;
      svg.appendChild(text);
    }

    let pathD = `M${pad.l},${pad.t+ch}`;
    data.forEach((d,i) => {
      const x = pad.l + (d.year - 2020) / 80 * cw;
      const y = pad.t + ch - (d.val - minV) / range * ch;
      pathD += ` L${x},${y}`;
    });
    pathD += ` L${pad.l+cw},${pad.t+ch} Z`;
    const area = document.createElementNS('http://www.w3.org/2000/svg','path');
    area.setAttribute('d', pathD);
    area.setAttribute('fill', 'var(--kimi-chart-1)');
    area.setAttribute('class', 'chart-area');
    svg.appendChild(area);

    let lineD = '';
    data.forEach((d,i) => {
      const x = pad.l + (d.year - 2020) / 80 * cw;
      const y = pad.t + ch - (d.val - minV) / range * ch;
      lineD += (i===0?'M':'L') + `${x},${y}`;
    });
    const line = document.createElementNS('http://www.w3.org/2000/svg','path');
    line.setAttribute('d', lineD);
    line.setAttribute('stroke', 'var(--kimi-chart-1)');
    line.setAttribute('class', 'chart-line');
    svg.appendChild(line);

    const cx = pad.l + (currentYear - 2020) / 80 * cw;
    const cy = pad.t + ch - (getProjection(currentCountry, currentVar, currentYear, currentScenario) - minV) / range * ch;
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx', cx); circle.setAttribute('cy', cy); circle.setAttribute('r', 5);
    circle.setAttribute('fill', 'var(--kimi-color-text-primary)');
    svg.appendChild(circle);

    const titles = {temp:'Temperatura media anual', precip:'Precipitación anual', humidity:'Humedad relativa', wind:'Velocidad del viento', ztd:'Retardo troposférico cenital (ZTD)'};
    const title = document.createElementNS('http://www.w3.org/2000/svg','text');
    title.setAttribute('x', W/2); title.setAttribute('y', 18); title.setAttribute('text-anchor','middle');
    title.setAttribute('class','chart-title');
    title.textContent = `${titles[currentVar] || ''} — ${currentCountry.name}`;
    svg.appendChild(title);

    chartLegend.innerHTML = `
      <div class="legend-item"><div class="legend-dot" style="background:var(--kimi-chart-1)"></div>Proyección ${currentScenario.toUpperCase()}</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--kimi-color-text-primary)"></div>Año seleccionado: ${currentYear}</div>
    `;
  }

  function updateSirgas() {
    const s = scenarios[currentScenario];
    const t = (currentYear - 2020) / 80;
    const sigmoid = t * t * (3 - 2 * t);
    sirgasGrid.innerHTML = '';
    sirgasStations.forEach(st => {
      const ztd = st.baseZTD + s.ztdFactor * sigmoid * (1 + 0.15 * Math.sin(currentYear * 0.3 + st.lat));
      const pct = Math.min(100, (ztd / 3.0) * 100);
      const div = document.createElement('div'); div.className = 'sirgas-station';
      div.innerHTML = `
        <div class="station-name">${st.name}</div>
        <div class="station-meta">${st.city} | ZTD ${currentYear}: ${ztd.toFixed(3)} m</div>
        <div class="ztd-bar"><div class="ztd-fill" style="width:${pct}%;background:var(--kimi-chart-1)"></div></div>
        <div class="station-meta" style="margin-top:4px;">Base: ${st.baseZTD.toFixed(3)} m | Δ: +${(ztd-st.baseZTD).toFixed(3)} m</div>
      `;
      sirgasGrid.appendChild(div);
    });
  }

  function updateHurricanes() {
    const tracks = getHurricaneData(currentCountry, currentYear, currentScenario);
    hurricaneList.innerHTML = '';
    if(tracks.length === 0) {
      hurricaneList.innerHTML = '<div style="text-align:center;color:var(--kimi-color-text-tertiary);padding:20px;">Sin ciclones tropicales proyectados para este año en esta región</div>';
      return;
    }
    tracks.forEach(tr => {
      const catClass = tr.category >= 5 ? 'cat-5' : (tr.category >= 3 ? 'cat-3' : 'cat-1');
      const div = document.createElement('div'); div.className = 'hurricane-track';
      div.innerHTML = `
        <span class="cat-badge ${catClass}">Cat ${tr.category}</span>
        <span style="font-weight:500;">${tr.name}</span>
        <span style="color:var(--kimi-color-text-tertiary);font-size:12px;">Mes ${tr.month} — Viento sostenido: ${Math.round(tr.wind)} km/h</span>
      `;
      hurricaneList.appendChild(div);
    });
  }

  function updateAll() {
    currentCountry = countries.find(c => c.name === countrySelect.value) || countries[0];
    currentVar = varSelect.value;
    currentYear = parseInt(yearSlider.value);
    yearLabel.textContent = currentYear;

    updateMetrics();
    drawChart();

    if(currentVar === 'ztd') {
      sirgasPanel.style.display = 'block';
      updateSirgas();
    } else {
      sirgasPanel.style.display = 'none';
    }

    if(currentVar === 'hurricanes') {
      hurricanePanel.style.display = 'block';
      updateHurricanes();
      document.querySelector('.chart-container').style.display = 'none';
      document.getElementById('chartLegend').style.display = 'none';
    } else {
      hurricanePanel.style.display = 'none';
      document.querySelector('.chart-container').style.display = 'block';
      document.getElementById('chartLegend').style.display = 'flex';
    }

    if(window.latamMapInstance) {
      window.latamMapInstance.setView([currentCountry.lat, currentCountry.lon], 5);
      // Mover marcador
      if(window.marcadorActual) {
        window.marcadorActual.setLatLng([currentCountry.lat, currentCountry.lon]);
      }
      // Resaltar polígono
      if(window.paisActualPoligono) window.paisActualPoligono.remove();
      const coords = window.paisesPoligonos?.[currentCountry.name];
      if(coords) {
        window.paisActualPoligono = L.polygon(coords, {
          color: '#dc2626',
          weight: 2.5,
          fillColor: '#dc2626',
          fillOpacity: 0.25,
          dashArray: '4,4'
        }).bindPopup(`<b>${currentCountry.name}</b>`).addTo(window.latamMapInstance);
      }
    }
  }

  countrySelect.addEventListener('change', updateAll);
  varSelect.addEventListener('change', updateAll);
  yearSlider.addEventListener('input', updateAll);
  scenarioTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      scenarioTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentScenario = tab.dataset.scenario;
      updateAll();
    });
  });

  // Inicializar mapa Leaflet
  window.latamMapInstance = L.map('latamMap').setView([-15, -60], 4);
  
  // Polígonos simplificados de países
  window.paisesPoligonos = {
    'Colombia': [[12.5,-79.0],[12.5,-71.0],[4.0,-67.0],[-4.0,-70.0],[-2.0,-79.0],[1.0,-79.0],[8.0,-77.0],[12.5,-79.0]],
    'Perú': [[-0.0,-81.0],[-3.0,-80.0],[-18.0,-70.0],[-18.0,-81.0],[-0.0,-81.0]],
    'Chile': [[-17.0,-72.0],[-56.0,-68.0],[-56.0,-75.0],[-17.0,-72.0]],
    'Argentina': [[-22.0,-65.0],[-55.0,-58.0],[-55.0,-73.0],[-22.0,-65.0]],
    'Brasil': [[-33.0,-53.0],[5.0,-35.0],[5.0,-74.0],[-33.0,-53.0]],
    'Bolivia': [[-10.0,-69.0],[-23.0,-58.0],[-23.0,-69.0],[-10.0,-69.0]],
    'Ecuador': [[1.0,-81.0],[-5.0,-76.0],[-5.0,-81.0],[1.0,-81.0]],
    'Venezuela': [[12.0,-73.0],[1.0,-61.0],[1.0,-73.0],[12.0,-73.0]],
    'Paraguay': [[-19.0,-62.0],[-27.0,-54.0],[-27.0,-62.0],[-19.0,-62.0]],
    'Uruguay': [[-30.0,-58.0],[-35.0,-53.0],[-35.0,-58.0],[-30.0,-58.0]],
  };
  
  // Agregar polígonos
  Object.entries(window.paisesPoligonos).forEach(([nombre, coords]) => {
    L.polygon(coords, {
      color: '#2563eb',
      weight: 1,
      fillColor: '#2563eb',
      fillOpacity: 0.15
    }).bindTooltip(nombre).addTo(window.latamMapInstance);
  });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(window.latamMapInstance);
  
  // Un solo marcador para el país seleccionado (se actualizará en updateAll)
  window.marcadorActual = L.circleMarker([-15, -60], {
    radius: 10,
    fillColor: '#dc2626',
    color: '#991b1b',
    weight: 2,
    fillOpacity: 0.9
  }).addTo(window.latamMapInstance);

  updateAll();
})();
</script>
</body>
</html>
