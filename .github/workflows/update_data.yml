name: Actualizar datos oficiales (IDEAM / SENAMHI)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests

      - name: Ejecutar script de IDEAM
        run: |
          python ideam_data_fetcher.py
        continue-on-error: true

      - name: Ejecutar script de SENAMHI
        run: |
          python senamhi_data_fetcher.py
        continue-on-error: true

      - name: Subir cambios al repositorio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ideam_datos.json senamhi_datos.json
          git diff --staged --quiet || git commit -m "Actualización automática de datos oficiales $(date +'%Y-%m-%d')"
          git push


