name: Actualizar datos oficiales (IDEAM / SENAMHI)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests

      - name: Ejecutar script de IDEAM
        id: ideam
        run: |
          python ideam_data_fetcher.py
          echo "status=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Ejecutar script de SENAMHI
        id: senamhi
        run: |
          python senamhi_data_fetcher.py
          echo "status=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Verificar archivos generados
        run: |
          echo "=== Archivos en el repositorio ==="
          ls -la
          echo "=== Archivos JSON ==="
          ls -la *.json 2>/dev/null || echo "No hay archivos JSON"
          echo "=== Contenido de ideam_datos.json (primeras líneas) ==="
          head -20 ideam_datos.json 2>/dev/null || echo "archivo no existe"
          echo "=== Contenido de senamhi_datos.json (primeras líneas) ==="
          head -20 senamhi_datos.json 2>/dev/null || echo "archivo no existe"

      - name: Subir cambios al repositorio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Verificar si hay cambios
          git add ideam_datos.json senamhi_datos.json 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "ℹ️ No hay cambios para commitear"
          else
            git commit -m "Actualización automática de datos oficiales $(date +'%Y-%m-%d %H:%M:%S')"
            git push https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
            echo "✅ Cambios subidos exitosamente"
          fi
