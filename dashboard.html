<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Andes Observatorio</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f0f7f0; padding: 20px; }
        h1 { color: green; text-align: center; }
        .stats { display: flex; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 10px; flex: 1; text-align: center; }
        .value { font-size: 32px; color: gold; font-weight: bold; }
        #map { height: 400px; margin: 20px 0; }
        .charts { display: flex; gap: 20px; flex-wrap: wrap; }
        .chart-card { background: white; padding: 20px; border-radius: 10px; flex: 1; }
        canvas { max-height: 300px; }
        footer { text-align: center; margin-top: 30px; padding: 20px; background: green; color: white; }
        select { padding: 10px; margin: 10px; }
    </style>
</head>
<body>
    <h1>🏔️ Andes Observatorio - Dashboard Ambiental</h1>
    
    <div style="text-align:center">
        <label>Ciudad: </label>
        <select id="citySelect">
            <option value="Bogota,CO">Bogotá</option>
            <option value="Quito,EC">Quito</option>
            <option value="Lima,PE">Lima</option>
            <option value="La Paz,BO">La Paz</option>
            <option value="Santiago,CL">Santiago</option>
<option value="Caracas,VE">Caracas, Venezuela</option>
<option Value="Panama City,PA">Panamá, Panamá</option>
        </select>
    </div>

    <div class="stats">
        <div class="card"><h3>🌡️ Temperatura</h3><div class="value" id="temp">--</div><div>°C</div></div>
        <div class="card"><h3>💧 Humedad</h3><div class="value" id="hum">--</div><div>%</div></div>
        <div class="card"><h3>🌡️ Sensación</h3><div class="value" id="feels">--</div><div>°C</div></div>
    </div>

    <div id="map"></div>

    <div class="charts">
        <div class="chart-card"><h3>Temperatura por País</h3><canvas id="tempChart"></canvas></div>
    </div>

    <footer>
        <p>andesobservatorio@gmail.com | +57 3337211047</p>
    </footer>

    <script>
        const API_KEY = "257ead5e0a9128276d4c947480000ebb";
        
        const ciudades = [
            { nombre: "Bogotá", pais: "Colombia", query: "Bogota,CO", lat: 4.7110, lon: -74.0721 },
            { nombre: "Quito", pais: "Ecuador", query: "Quito,EC", lat: -0.1807, lon: -78.4678 },
            { nombre: "Lima", pais: "Perú", query: "Lima,PE", lat: -12.0464, lon: -77.0428 },
            { nombre: "La Paz", pais: "Bolivia", query: "La Paz,BO", lat: -16.5000, lon: -68.1500 },
            { nombre: "Santiago", pais: "Chile", query: "Santiago,CL", lat: -33.4489, lon: -70.6693 }
{ nombre: "Caracas", pais: "Venezuela",query: "Caracas, VE", lat: 10.4806, lon: -66.9036 },
{ nombre: "Panamá", pais: "Panamá", query: "Panama City,PA", lat: 8.9824, lon: -79.5199 }


        ];
        
        let map, tempChart;
        
        async function obtenerClima(query) {
            const url = `https://api.openweathermap.org/data/2.5/weather?q=${query}&units=metric&appid=${API_KEY}`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                if(data.cod === 200) {
                    return { temp: data.main.temp, hum: data.main.humidity, feels: data.main.feels_like };
                }
                return null;
            } catch(e) {
                return null;
            }
        }
        
        async function actualizarTodo() {
            const select = document.getElementById('citySelect');
            const clima = await obtenerClima(select.value);
            if(clima) {
                document.getElementById('temp').innerText = clima.temp.toFixed(1);
                document.getElementById('hum').innerText = clima.hum;
                document.getElementById('feels').innerText = clima.feels.toFixed(1);
            }
            
            const temps = [];
            const labels = [];
            for(const c of ciudades) {
                const cl = await obtenerClima(c.query);
                temps.push(cl ? cl.temp : 0);
                labels.push(c.pais);
                await new Promise(r => setTimeout(r, 300));
            }
            if(tempChart) {
                tempChart.data.datasets[0].data = temps;
                tempChart.data.labels = labels;
                tempChart.update();
            }
        }
        
        function initMap() {
            map = L.map('map').setView([-15, -65], 4);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            ciudades.forEach(c => {
                L.marker([c.lat, c.lon]).addTo(map);
            });
        }
        
        window.onload = () => {
            tempChart = new Chart(document.getElementById('tempChart'), {
                type: 'bar',
                data: { labels: [], datasets: [{ label: 'Temperatura (°C)', data: [], backgroundColor: 'green' }] }
            });
            initMap();
            actualizarTodo();
            document.getElementById('citySelect').onchange = actualizarTodo;
            setInterval(actualizarTodo, 600000);
        };
    </script>
</body>
</html>
